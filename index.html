<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* TRANSPARENT for OBS */
  body {
    background: transparent;
    width: 420px;
    height: 110px;
    overflow: hidden;
    font-family: 'Syne', sans-serif;
  }

  /* SETUP OVERLAY - shown when not configured */
  #setup {
    background: rgba(0,0,0,0.92);
    border: 1px solid #ff0080;
    border-radius: 12px;
    padding: 16px 20px;
    color: #fff;
    font-size: 12px;
    line-height: 1.7;
    width: 420px;
  }

  #setup strong { color: #ff0080; }
  #setup code {
    background: #1a1a1a;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    color: #ff0080;
  }

  /* PLAYER WIDGET */
  #player {
    display: none;
    width: 420px;
    height: 110px;
    position: relative;
    animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* CARD */
  .card {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(10,10,10,0.92) 0%, rgba(20,8,15,0.92) 100%);
    border-radius: 14px;
    border: 1px solid rgba(255,0,128,0.25);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.04);
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 0;
    backdrop-filter: blur(20px);
  }

  /* Pink accent line top */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff0080, transparent);
    opacity: 0.8;
  }

  /* Album art */
  .art-wrap {
    width: 110px;
    height: 110px;
    flex-shrink: 0;
    position: relative;
    border-radius: 13px 0 0 13px;
    overflow: hidden;
  }

  .album-art {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.5s ease;
  }

  .art-placeholder {
    width: 100%;
    height: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }

  /* Gradient overlay on art */
  .art-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 60%, rgba(10,10,10,0.5));
  }

  /* Info section */
  .info {
    flex: 1;
    padding: 14px 16px 12px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 110px;
  }

  .top-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }

  .now-playing-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: #ff0080;
    text-shadow: 0 0 10px rgba(255,0,128,0.5);
    flex-shrink: 0;
  }

  .pulse-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ff0080;
    box-shadow: 0 0 6px #ff0080;
    animation: pulse 1.5s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.7); }
  }

  .pulse-dot.paused { animation: none; opacity: 0.3; }

  .track-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 0.5px;
    color: #ffffff;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .track-artist {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.3px;
    margin-top: 2px;
  }

  /* Progress */
  .progress-wrap {
    margin-top: 8px;
  }

  .progress-bar {
    height: 2px;
    background: rgba(255,255,255,0.1);
    border-radius: 1px;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff0080, #ff4db8);
    border-radius: 1px;
    box-shadow: 0 0 6px rgba(255,0,128,0.6);
    transition: width 0.8s linear;
    width: 0%;
  }

  .progress-times {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 1px;
  }

  /* Track change animation */
  @keyframes trackIn {
    from { opacity: 0; transform: translateX(8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .track-change { animation: trackIn 0.4s ease forwards; }

  /* Hidden state - slides out when nothing playing */
  #player.hidden {
    animation: slideOut 0.5s ease forwards;
  }

  @keyframes slideOut {
    to { opacity: 0; transform: translateY(15px); }
  }
</style>
</head>
<body>

<!-- SETUP MESSAGE (shown in OBS until Client ID is set) -->
<div id="setup">
  <strong>⚡ Spotify Overlay Setup</strong><br>
  Edit this file and set your Client ID on line 1 of the script below.<br>
  Then add <code>YOUR_GITHUB_URL?overlay=1</code> as a browser source in OBS.<br>
  Size: <strong>420 × 110px</strong>
</div>

<!-- OVERLAY PLAYER -->
<div id="player">
  <div class="card">
    <div class="art-wrap">
      <div class="art-placeholder" id="art-placeholder">🎵</div>
      <img class="album-art" id="album-art" src="" alt="" style="display:none; opacity:0">
    </div>
    <div class="info">
      <div>
        <div class="top-row">
          <span class="now-playing-label">NOW PLAYING</span>
          <span class="pulse-dot" id="pulse-dot"></span>
        </div>
        <div class="track-name" id="track-name">—</div>
        <div class="track-artist" id="track-artist"></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-times">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// SET YOUR CLIENT ID HERE
const CLIENT_ID = '35c786c113b14d79b5e61fda64528838';
// ─────────────────────────────────────────────

const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];
const SCOPES = 'user-read-playback-state user-read-currently-playing';
const IS_OVERLAY = new URLSearchParams(window.location.search).has('overlay');

let accessToken = localStorage.getItem('sp_access_token') || null;
let tokenExpiry = parseInt(localStorage.getItem('sp_token_expiry') || '0');
let currentTrackId = null;
let isPlaying = false;
let trackDuration = 0;
let localProgress = 0;


// Show setup message if no client ID
if (!CLIENT_ID) {
  document.getElementById('setup').style.display = 'block';
  document.getElementById('player').style.display = 'none';
} else {
  document.getElementById('setup').style.display = 'none';
  init();
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (code) {
    window.history.replaceState({}, document.title, window.location.pathname + (IS_OVERLAY ? '?overlay=1' : ''));
    await exchangeCode(code);
    startPlayer();
  } else if (accessToken && Date.now() < tokenExpiry) {
    startPlayer();
  } else {
    // Need to auth — open auth in same window
    await startAuth();
  }
}

async function generateCodeVerifier(length = 64) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  let result = '';
  const arr = new Uint8Array(length);
  crypto.getRandomValues(arr);
  arr.forEach(b => result += chars[b % chars.length]);
  return result;
}

async function generateCodeChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function startAuth() {
  const verifier = await generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  localStorage.setItem('sp_cv', verifier);

  const url = new URL('https://accounts.spotify.com/authorize');
  url.searchParams.set('client_id', CLIENT_ID);
  url.searchParams.set('response_type', 'code');
  url.searchParams.set('redirect_uri', REDIRECT_URI);
  url.searchParams.set('scope', SCOPES);
  url.searchParams.set('code_challenge_method', 'S256');
  url.searchParams.set('code_challenge', challenge);
  window.location.href = url.toString();
}

async function exchangeCode(code) {
  const verifier = localStorage.getItem('sp_cv');
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI, code_verifier: verifier })
  });
  const data = await res.json();
  if (data.access_token) {
    accessToken = data.access_token;
    tokenExpiry = Date.now() + (data.expires_in * 1000) - 60000;
    localStorage.setItem('sp_access_token', accessToken);
    localStorage.setItem('sp_refresh_token', data.refresh_token || '');
    localStorage.setItem('sp_token_expiry', tokenExpiry.toString());
    localStorage.removeItem('sp_cv');
  }
}

async function refreshAccessToken() {
  const rt = localStorage.getItem('sp_refresh_token');
  if (!rt) { await startAuth(); return; }
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'refresh_token', refresh_token: rt })
  });
  const data = await res.json();
  if (data.access_token) {
    accessToken = data.access_token;
    tokenExpiry = Date.now() + (data.expires_in * 1000) - 60000;
    localStorage.setItem('sp_access_token', accessToken);
    localStorage.setItem('sp_token_expiry', tokenExpiry.toString());
    if (data.refresh_token) localStorage.setItem('sp_refresh_token', data.refresh_token);
  } else { await startAuth(); }
}

async function spotifyFetch(endpoint) {
  if (Date.now() > tokenExpiry) await refreshAccessToken();
  const res = await fetch('https://api.spotify.com/v1' + endpoint, {
    headers: { 'Authorization': 'Bearer ' + accessToken }
  });
  if (res.status === 401) { await refreshAccessToken(); return spotifyFetch(endpoint); }
  if (res.status === 204) return null;
  if (!res.ok) return null;
  try { return await res.json(); } catch { return null; }
}

function startPlayer() {
  document.getElementById('player').style.display = 'block';
  fetchPlayback();
  setInterval(fetchPlayback, 3000);
  setInterval(() => {
    if (isPlaying && trackDuration > 0) {
      localProgress = Math.min(localProgress + 1000, trackDuration);
      updateProgress(localProgress, trackDuration);
    }
  }, 1000);
}

async function fetchPlayback() {
  const data = await spotifyFetch('/me/player');

  if (!data || !data.item) {
    isPlaying = false;
    document.getElementById('player').classList.add('hidden');
    return;
  }

  const track = data.item;
  const wasPlaying = isPlaying;
  isPlaying = data.is_playing;
  trackDuration = track.duration_ms;
  localProgress = data.progress_ms;

  // Show/hide instantly based on play state
  if (isPlaying) {
    document.getElementById('player').classList.remove('hidden');
    document.getElementById('player').style.display = 'block';
  } else {
    document.getElementById('player').classList.add('hidden');
  }

  document.getElementById('pulse-dot').classList.toggle('paused', !isPlaying);
  updateProgress(data.progress_ms, track.duration_ms);

  if (track.id !== currentTrackId) {
    currentTrackId = track.id;

    const nameEl = document.getElementById('track-name');
    const artistEl = document.getElementById('track-artist');
    nameEl.classList.remove('track-change');
    artistEl.classList.remove('track-change');
    void nameEl.offsetWidth;

    nameEl.textContent = track.name;
    artistEl.textContent = track.artists.map(a => a.name).join(', ');
    nameEl.classList.add('track-change');
    artistEl.classList.add('track-change');

    const art = track.album.images?.[0]?.url;
    if (art) {
      const img = document.getElementById('album-art');
      img.style.opacity = '0';
      img.onload = () => { img.style.opacity = '1'; img.style.transition = 'opacity 0.5s ease'; };
      img.src = art;
      img.style.display = 'block';
      document.getElementById('art-placeholder').style.display = 'none';
    }
  }
}

function updateProgress(progress, duration) {
  const pct = duration > 0 ? (progress / duration * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('time-current').textContent = msToTime(progress);
  document.getElementById('time-total').textContent = msToTime(duration);
}

function msToTime(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + (s % 60).toString().padStart(2, '0');
}
</script>
</body>
</html>
