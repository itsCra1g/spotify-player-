<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spotify Now Playing Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--hero:#C6FF00;--bg:rgba(8,8,9,.94);--border:rgba(255,255,255,.12);--muted:rgba(255,255,255,.58);--bar-bg:rgba(255,255,255,.13)}body{width:900px;height:270px;background:transparent;overflow:hidden;font-family:Inter,Arial,sans-serif}#setup{width:900px;min-height:220px;padding:30px;border-radius:26px;background:var(--bg);border:1px solid var(--border);color:white;font-size:18px;line-height:1.6}#setup strong{color:var(--hero)}#setup code{color:var(--hero);background:rgba(255,255,255,.06);padding:3px 8px;border-radius:6px}#player{display:none;width:900px;height:270px;padding:20px;animation:fadeIn .45s ease forwards}.card{width:100%;height:100%;display:flex;gap:34px;align-items:center;padding:24px;border-radius:28px;background:radial-gradient(circle at 25% 10%,rgba(255,255,255,.05),transparent 30%),linear-gradient(135deg,rgba(18,18,20,.97),rgba(6,6,7,.97));border:1px solid var(--border);box-shadow:0 26px 80px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06)}.art-wrap{width:190px;height:190px;flex:0 0 190px;border-radius:18px;overflow:hidden;background:#111;box-shadow:0 12px 34px rgba(0,0,0,.45)}.album-art{width:100%;height:100%;object-fit:cover;display:none;opacity:0;transition:opacity .35s ease}.art-placeholder{width:100%;height:100%;display:grid;place-items:center;font-size:58px;color:var(--hero)}.content{flex:1;min-width:0;height:190px;display:flex;flex-direction:column;justify-content:space-between}.label-row{display:flex;align-items:center;gap:16px;margin-bottom:22px}.spotify-icon{width:31px;height:31px;border-radius:50%;background:var(--hero);position:relative;flex:0 0 31px}.spotify-icon:before,.spotify-icon:after,.spotify-icon span{content:"";position:absolute;left:8px;height:3px;border-radius:999px;background:#070707;transform:rotate(12deg)}.spotify-icon:before{top:9px;width:17px}.spotify-icon span{top:14px;width:14px}.spotify-icon:after{top:19px;width:10px}.now-playing-label{color:var(--hero);font-size:20px;font-weight:800;letter-spacing:9px;line-height:1}.track-name{color:#fff;font-size:34px;line-height:1.12;font-weight:800;letter-spacing:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 16px rgba(0,0,0,.5);max-width:610px}.track-artist{color:var(--muted);margin-top:10px;font-size:27px;line-height:1.1;font-weight:600;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:610px}.progress-row{display:grid;grid-template-columns:78px 1fr 78px;align-items:center;gap:18px}.time{color:white;font-size:21px;font-weight:800;letter-spacing:.3px}.time.end{text-align:right}.progress-bar{height:10px;border-radius:999px;background:var(--bar-bg);overflow:hidden}.progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--hero),#D7FF4A);transition:width .8s linear}#player.hidden{animation:fadeOut .35s ease forwards}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeOut{to{opacity:0;transform:translateY(12px)}}
</style>
</head>
<body>
<div id="setup"><strong>Spotify Overlay Setup</strong><br>Set your Spotify Client ID in the script section near the bottom.<br>GitHub Pages URL example: <code>https://yourname.github.io/your-repo/?overlay=1</code><br>OBS Browser Source size: <strong>900 × 270</strong></div>
<div id="player"><div class="card"><div class="art-wrap"><div class="art-placeholder" id="art-placeholder">♪</div><img class="album-art" id="album-art" src="" alt="" /></div><div class="content"><div><div class="label-row"><div class="spotify-icon"><span></span></div><div class="now-playing-label">NOW PLAYING</div></div><div class="track-name" id="track-name">—</div><div class="track-artist" id="track-artist">—</div></div><div class="progress-row"><span class="time" id="time-current">0:00</span><div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div><span class="time end" id="time-total">0:00</span></div></div></div></div>
<script>
const CLIENT_ID='35c786c113b14d79b5e61fda64528838';
const REDIRECT_URI=window.location.href.split('?')[0].split('#')[0];
const SCOPES='user-read-playback-state user-read-currently-playing';
const IS_OVERLAY=new URLSearchParams(window.location.search).has('overlay');
let accessToken=localStorage.getItem('sp_access_token')||null;
let tokenExpiry=parseInt(localStorage.getItem('sp_token_expiry')||'0');
let currentTrackId=null,isPlaying=false,trackDuration=0,localProgress=0;
if(!CLIENT_ID||CLIENT_ID==='PASTE_YOUR_SPOTIFY_CLIENT_ID_HERE'){document.getElementById('setup').style.display='block';document.getElementById('player').style.display='none'}else{document.getElementById('setup').style.display='none';init()}
async function init(){const params=new URLSearchParams(window.location.search);const code=params.get('code');if(code){window.history.replaceState({},document.title,window.location.pathname+(IS_OVERLAY?'?overlay=1':''));await exchangeCode(code);startPlayer()}else if(accessToken&&Date.now()<tokenExpiry){startPlayer()}else{await startAuth()}}
async function generateCodeVerifier(length=64){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';let result='';const arr=new Uint8Array(length);crypto.getRandomValues(arr);arr.forEach(b=>result+=chars[b%chars.length]);return result}
async function generateCodeChallenge(verifier){const data=new TextEncoder().encode(verifier);const digest=await crypto.subtle.digest('SHA-256',data);return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'')}
async function startAuth(){const verifier=await generateCodeVerifier();const challenge=await generateCodeChallenge(verifier);localStorage.setItem('sp_cv',verifier);const url=new URL('https://accounts.spotify.com/authorize');url.searchParams.set('client_id',CLIENT_ID);url.searchParams.set('response_type','code');url.searchParams.set('redirect_uri',REDIRECT_URI);url.searchParams.set('scope',SCOPES);url.searchParams.set('code_challenge_method','S256');url.searchParams.set('code_challenge',challenge);window.location.href=url.toString()}
async function exchangeCode(code){const verifier=localStorage.getItem('sp_cv');const res=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:verifier})});const data=await res.json();if(data.access_token){accessToken=data.access_token;tokenExpiry=Date.now()+(data.expires_in*1000)-60000;localStorage.setItem('sp_access_token',accessToken);localStorage.setItem('sp_refresh_token',data.refresh_token||'');localStorage.setItem('sp_token_expiry',tokenExpiry.toString());localStorage.removeItem('sp_cv')}}
async function refreshAccessToken(){const rt=localStorage.getItem('sp_refresh_token');if(!rt){await startAuth();return}const res=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'refresh_token',refresh_token:rt})});const data=await res.json();if(data.access_token){accessToken=data.access_token;tokenExpiry=Date.now()+(data.expires_in*1000)-60000;localStorage.setItem('sp_access_token',accessToken);localStorage.setItem('sp_token_expiry',tokenExpiry.toString());if(data.refresh_token)localStorage.setItem('sp_refresh_token',data.refresh_token)}else{await startAuth()}}
async function spotifyFetch(endpoint){if(Date.now()>tokenExpiry)await refreshAccessToken();const res=await fetch('https://api.spotify.com/v1'+endpoint,{headers:{Authorization:'Bearer '+accessToken}});if(res.status===401){await refreshAccessToken();return spotifyFetch(endpoint)}if(res.status===204)return null;if(!res.ok)return null;try{return await res.json()}catch{return null}}
function startPlayer(){document.getElementById('player').style.display='block';fetchPlayback();setInterval(fetchPlayback,3000);setInterval(()=>{if(isPlaying&&trackDuration>0){localProgress=Math.min(localProgress+1000,trackDuration);updateProgress(localProgress,trackDuration)}},1000)}
async function fetchPlayback(){const data=await spotifyFetch('/me/player');if(!data||!data.item){isPlaying=false;document.getElementById('player').classList.add('hidden');return}const track=data.item;isPlaying=data.is_playing;trackDuration=track.duration_ms;localProgress=data.progress_ms;if(isPlaying){document.getElementById('player').classList.remove('hidden');document.getElementById('player').style.display='block'}else{document.getElementById('player').classList.add('hidden')}updateProgress(data.progress_ms,track.duration_ms);if(track.id!==currentTrackId){currentTrackId=track.id;document.getElementById('track-name').textContent=track.name;document.getElementById('track-artist').textContent=track.artists.map(a=>a.name).join(', ');const art=track.album.images?.[0]?.url;if(art){const img=document.getElementById('album-art');img.style.opacity='0';img.onload=()=>{img.style.opacity='1'};img.src=art;img.style.display='block';document.getElementById('art-placeholder').style.display='none'}}}
function updateProgress(progress,duration){const pct=duration>0?(progress/duration*100):0;document.getElementById('progress-fill').style.width=pct+'%';document.getElementById('time-current').textContent=msToTime(progress);document.getElementById('time-total').textContent=msToTime(duration)}
function msToTime(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0')}
</script>
</body>
</html>
